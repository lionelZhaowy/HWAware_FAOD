defaults:
  - general
  - dataset: ???
  - model: rnndet
  - _self_

# Relative checkpoint paths are resolved from the project root.
# Override for Time Shift: checkpoint=checkpoints/pku_fusion_time_shift.ckpt
checkpoint: checkpoints/${dataset.name}.ckpt
use_test_set: True
hardware:
  num_workers:
    eval: 6
  gpus: 0 # GPU idx (multi-gpu not supported for validation)
batch_size:
  eval: 4
training:
  precision: "16-mixed"
